name: Supabase migrations

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/prepare-supabase-migrations.sh'
      - '.github/workflows/supabase-migrations.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/prepare-supabase-migrations.sh'
      - '.github/workflows/supabase-migrations.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  validate:
    name: Validate migration files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare tracked migrations
        run: ./scripts/prepare-supabase-migrations.sh "$RUNNER_TEMP/supabase"
      - name: Prevent changes to applied migrations
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-status "$BASE_SHA"...HEAD -- 'supabase/migrations/[0-9]*_*.sql' | awk '$1 != "A" { print }')
          if [ -n "$changed" ]; then
            echo "Timestamped migrations are immutable after commit. Add a new migration instead:"
            echo "$changed"
            exit 1
          fi

  deploy:
    name: Apply production migrations
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0
      - name: Prepare tracked migrations
        run: ./scripts/prepare-supabase-migrations.sh "$RUNNER_TEMP/supabase"
      # One-time bootstrap reconciliation (2026-11-27): the CLI applied these
      # eight migrations in the first successful run (verified in production:
      # tables, policies and RPCs all exist) but never recorded them in the
      # history table. Seed the history so the runner only applies genuinely
      # new migrations — replaying these files is NOT safe (some are not
      # idempotent).
      - name: Reconcile migration history
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
          echo "── current migration history ──"
          psql "$SUPABASE_DB_URL" -c "select version from supabase_migrations.schema_migrations order by version;"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "
            insert into supabase_migrations.schema_migrations(version, name) values
              ('20260810030000','fix_post_views_tracking'),
              ('20261126000000','atomic_stripe_fulfillment'),
              ('20261127000000','showcase_sponsorship'),
              ('20261127010000','film_brand_placements'),
              ('20261127020000','marketplace_commerce'),
              ('20261127130000','community_lounges'),
              ('20261127140000','fix_conversation_members_rls_reapply'),
              ('20261127150000','expeditions')
            on conflict (version) do nothing;"
      # The supabase CLI's db push proved unreliable over the session pooler
      # (reports "up to date" with an empty history table). This deterministic
      # runner applies any staged migration whose version is not recorded,
      # in filename order, and records it. All migrations are idempotent.
      - name: Apply pending migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_DB_URL" || { echo "Missing SUPABASE_DB_URL repository or production environment secret"; exit 1; }
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
          for f in "$RUNNER_TEMP"/supabase/migrations/*.sql; do
            base=$(basename "$f")
            version="${base%%_*}"
            applied=$(psql "$SUPABASE_DB_URL" -tAc "select 1 from supabase_migrations.schema_migrations where version='$version'" || true)
            if [ "$applied" = "1" ]; then
              echo "── $base already applied"
              continue
            fi
            echo "── applying $base"
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$f"
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 \
              -c "insert into supabase_migrations.schema_migrations(version, name) values ('$version', '${base%.sql}') on conflict (version) do nothing"
          done
          echo "── done"
